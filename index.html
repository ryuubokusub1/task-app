<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ</title>
<style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #111827;      /* くっきり見える濃い文字色 */
      --text-muted: #4b5563;     /* 補足用テキスト */
      --border-color: #cbd5e1;   /* 視認性の高い枠線 */
      --input-bg: #ffffff;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 600px;
      height: fit-content;
    }

    h2, h3 {
      margin-top: 0;
      color: var(--text-main);
      font-weight: 700;
    }

    h2 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
    h3 { font-size: 1.05rem; margin-bottom: 12px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.875rem; font-weight: 600; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--input-bg);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-danger { background-color: var(--danger-color); }
    .btn-danger:hover { background-color: var(--danger-hover); }

    .hidden { display: none !important; }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      gap: 12px;
    }

    #user-info { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }

    /* タスク追加エリア */
    .add-task-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .add-task-box input { flex: 1; }

    /* タブデザイン */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 16px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    /* 絞り込みバー */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
      font-size: 0.875rem;
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text-main);
      font-weight: 600;
    }
    .filter-bar select { flex: 1; margin: 0; }

    /* タスクリスト */
    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 8px;
      background: #ffffff;
      color: var(--text-main);
      gap: 12px;
    }
    .task-item.completed span { text-decoration: line-through; color: #94a3b8; }
    .task-item span { flex: 1; word-break: break-word; font-weight: 500; }

    /* 各種セクション */
    .section-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px solid #e2e8f0;
    }

    .log-item {
      font-size: 0.85rem;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
      color: var(--text-main);
      word-break: break-all;
    }

    #message {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.25em;
    }

    /* モバイル対応調整 */
    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 16px; }
      .add-task-box { flex-direction: column; }
      .task-item { flex-direction: column; align-items: flex-start; }
      .task-item button { width: 100%; margin-top: 8px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- ログイン画面 -->
    <div id="login-section">
      <h2>ログイン</h2>
      <div class="form-group">
        <label>ユーザー名</label>
        <input type="text" id="username" value="admin">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="password" value="admin123">
      </div>
      <button onclick="login()" style="width: 100%;">ログイン</button>
    </div>

    <!-- アプリメイン画面 -->
    <div id="app-section" class="hidden">
      <div class="header">
        <span id="user-info">ようこそ！</span>
        <button onclick="logout()" class="btn-danger">ログアウト</button>
      </div>

      <h3>タスク追加</h3>
      <div class="add-task-box">
        <input type="text" id="new-task-title" placeholder="新しいタスクを入力...">
        <button onclick="createTask()">追加</button>
      </div>

      <h3>タスク一覧</h3>

      <!-- 状態切り替えタブ -->
      <div class="tabs">
        <button id="tab-uncompleted" class="tab-btn active" onclick="switchStatusTab('未完了')">未完了</button>
        <button id="tab-completed" class="tab-btn" onclick="switchStatusTab('完了')">完了</button>
        <button id="tab-all" class="tab-btn" onclick="switchStatusTab('すべて')">すべて</button>
      </div>

      <!-- マスタユーザー専用：ユーザー絞り込みドロップダウン -->
      <div id="user-filter-box" class="filter-bar hidden">
        <label for="user-select">表示ユーザー:</label>
        <select id="user-select" onchange="renderTasks()">
          <option value="ALL">すべてのユーザー</option>
        </select>
      </div>

      <div id="task-list">読み込み中...</div>

<!-- ユーザー設定変更エリア（折りたたみ式） -->
      <div class="section-box">
        <button onclick="toggleAccordion('profile-setting-box')" class="btn-secondary" style="width: 100%; text-align: left;">
          ⚙️ アカウント設定の変更 ▽
        </button>
        <div id="profile-setting-box" class="hidden" style="margin-top: 15px;">
          <div class="form-group">
            <label>新しいユーザー名</label>
            <input type="text" id="edit-username">
          </div>
          <div class="form-group">
            <label>新しいパスワード</label>
            <input type="password" id="edit-password" placeholder="新しいパスワードを入力">
          </div>
          <button onclick="updateProfile()" class="btn-secondary">設定を保存する</button>
        </div>
      </div>

      <!-- マスタユーザー専用エリア -->
      <div id="admin-section" class="section-box admin-box hidden">
        <h3>【マスタ機能】全体操作履歴</h3>
        <button onclick="loadLogs()" class="btn-secondary">履歴ログを更新</button>
        <div id="log-list" style="margin-top: 15px;">ボタンを押すと履歴を取得します</div>
      </div>
    </div>

    <div id="message"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwrujO1lvSsyCSYRpcbLxoLHhkziiVouQo4LQvK23QejUfYGCLEUuJNfxUJurGSTQuy/exec";
    let currentUser = null;
    let allTasksCache = [];
    let currentStatusTab = "未完了";

    window.onload = () => {
      const savedUser = sessionStorage.getItem("user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showApp();
      }
    };

    async function login() {
      const usernameInput = document.getElementById("username").value;
      const passwordInput = document.getElementById("password").value;
      showMessage("通信中...", "#333");

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", username: usernameInput, password: passwordInput })
        });
        const data = await res.json();

        if (data.status === "success") {
          currentUser = data.user;
          sessionStorage.setItem("user", JSON.stringify(data.user));
          sessionStorage.setItem("token", data.token);
          showMessage("", "");
          showApp();
        } else {
          showMessage(data.message, "red");
        }
      } catch (err) {
        showMessage("エラーが発生しました: " + err.message, "red");
      }
    }

    function logout() {
      sessionStorage.clear();
      currentUser = null;
      document.getElementById("app-section").classList.add("hidden");
      document.getElementById("admin-section").classList.add("hidden");
      document.getElementById("user-filter-box").classList.add("hidden");
      document.getElementById("login-section").classList.remove("hidden");
      showMessage("ログアウトしました", "green");
    }

    function showApp() {
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      document.getElementById("user-info").innerText = `${currentUser.username} 様 (${currentUser.role})`;
      document.getElementById("edit-username").value = currentUser.username;
      
      const adminSection = document.getElementById("admin-section");
      const userFilterBox = document.getElementById("user-filter-box");

      if (currentUser.role === "admin") {
        adminSection.classList.remove("hidden");
        userFilterBox.classList.remove("hidden");
        loadLogs();
      } else {
        adminSection.classList.add("hidden");
        userFilterBox.classList.add("hidden");
      }

      loadTasks();
    }

    async function loadTasks() {
      const taskListDiv = document.getElementById("task-list");
      taskListDiv.innerHTML = "読み込み中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getTasks", userId: currentUser.id, role: currentUser.role })
        });
        const data = await res.json();

        if (data.status === "success") {
          allTasksCache = data.tasks;
          
          if (currentUser.role === "admin") {
            setupUserFilterOptions();
          } else {
            document.getElementById("user-select").innerHTML = '<option value="ALL">すべてのユーザー</option>';
          }

          renderTasks();
        }
      } catch (err) {
        taskListDiv.innerHTML = "タスクの取得に失敗しました";
      }
    }

    function setupUserFilterOptions() {
      const select = document.getElementById("user-select");
      const currentSelected = select.value || "ALL";
      select.innerHTML = '<option value="ALL">すべてのユーザー</option>';

      const userIds = [...new Set(allTasksCache.map(t => t.userId))];
      userIds.forEach(uid => {
        const opt = document.createElement("option");
        opt.value = uid;
        opt.innerText = `ユーザーID: ${uid}`;
        select.appendChild(opt);
      });

      select.value = currentSelected;
    }

    function switchStatusTab(status) {
      currentStatusTab = status;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      if (status === '未完了') document.getElementById("tab-uncompleted").classList.add("active");
      if (status === '完了') document.getElementById("tab-completed").classList.add("active");
      if (status === 'すべて') document.getElementById("tab-all").classList.add("active");
      renderTasks();
    }

    function renderTasks() {
      const taskListDiv = document.getElementById("task-list");
      
      let filtered = allTasksCache;

      if (currentStatusTab !== "すべて") {
        filtered = filtered.filter(t => t.status === currentStatusTab);
      }

      if (currentUser.role === "admin") {
        const selectedUser = document.getElementById("user-select").value;
        if (selectedUser !== "ALL") {
          filtered = filtered.filter(t => t.userId === selectedUser);
        }
      }

      if (filtered.length === 0) {
        taskListDiv.innerHTML = "<p>該当するタスクはありません</p>";
        return;
      }

      taskListDiv.innerHTML = "";
      filtered.forEach(task => {
        const item = document.createElement("div");
        item.className = `task-item ${task.status === '完了' ? 'completed' : ''}`;
        
        const ownerText = currentUser.role === "admin" ? `<small>[${task.userId}]</small> ` : "";
        
        item.innerHTML = `
          <span>${ownerText}${escapeHtml(task.title)} <small>(${task.status})</small></span>
          <button onclick="toggleTaskStatus('${task.id}', '${task.status}')">
            ${task.status === '完了' ? '未完了に戻す' : '完了にする'}
          </button>
        `;
        taskListDiv.appendChild(item);
      });
    }

    async function createTask() {
      const input = document.getElementById("new-task-title");
      const title = input.value.trim();
      if (!title) return;

      showMessage("タスクを追加中...", "#333");
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "createTask", userId: currentUser.id, title: title })
        });
        const data = await res.json();
        if (data.status === "success") {
          input.value = "";
          showMessage("タスクを追加しました！", "green");
          loadTasks();
          if (currentUser.role === "admin") loadLogs();
        }
      } catch (err) {
        showMessage("追加に失敗しました", "red");
      }
    }

    async function toggleTaskStatus(taskId, currentStatus) {
      const newStatus = currentStatus === "完了" ? "未完了" : "完了";
      showMessage("更新中...", "#333");
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "updateTaskStatus", userId: currentUser.id, taskId: taskId, status: newStatus })
        });
        const data = await res.json();
        if (data.status === "success") {
          showMessage("更新しました！", "green");
          loadTasks();
          if (currentUser.role === "admin") loadLogs();
        }
      } catch (err) {
        showMessage("更新に失敗しました", "red");
      }
    }

    // ユーザー情報変更処理
    async function updateProfile() {
      const newUsername = document.getElementById("edit-username").value.trim();
      const newPassword = document.getElementById("edit-password").value.trim();

      if (!newUsername || !newPassword) {
        showMessage("ユーザー名とパスワードの両方を入力してください", "red");
        return;
      }

      showMessage("更新中...", "#333");
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "updateUserProfile",
            userId: currentUser.id,
            newUsername: newUsername,
            newPassword: newPassword
          })
        });
        const data = await res.json();

        if (data.status === "success") {
          currentUser.username = data.updatedUsername;
          sessionStorage.setItem("user", JSON.stringify(currentUser));
          document.getElementById("user-info").innerText = `${currentUser.username} 様 (${currentUser.role})`;
          document.getElementById("edit-password").value = "";
          showMessage("アカウント情報を更新しました！次回から新しい情報でログインしてください", "green");
          if (currentUser.role === "admin") loadLogs();
        } else {
          showMessage(data.message, "red");
        }
      } catch (err) {
        showMessage("更新に失敗しました", "red");
      }
    }

async function loadLogs() {
      const logListDiv = document.getElementById("log-list");
      logListDiv.innerHTML = "履歴を取得中...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getLogs", role: currentUser.role })
        });
        const data = await res.json();

        if (data.status === "success") {
          if (data.logs.length === 0) {
            logListDiv.innerHTML = "履歴はありません";
            return;
          }
          logListDiv.innerHTML = "";
          data.logs.forEach(log => {
            const item = document.createElement("div");
            item.className = "log-item";
            
            // ISO文字列等の日時を yyyy-mm-dd hh:mm:ss 形式へ変換
            const formattedTime = formatTimestamp(log.timestamp);
            
            item.innerHTML = `<strong>[${formattedTime}]</strong> (ユーザー: ${log.userId}) ${escapeHtml(log.action)}`;
            logListDiv.appendChild(item);
          });
        } else {
          logListDiv.innerHTML = data.message;
        }
      } catch (err) {
        logListDiv.innerHTML = "履歴の取得に失敗しました";
      }
    }

    // 日時整形用関数
    function formatTimestamp(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      if (isNaN(d.getTime())) return ts; // 変換できない場合はそのまま表示

      const pad = n => String(n).padStart(2, '0');
      const YYYY = d.getFullYear();
      const MM = pad(d.getMonth() + 1);
      const DD = pad(d.getDate());
      const hh = pad(d.getHours());
      const mm = pad(d.getMinutes());
      const ss = pad(d.getSeconds());

      return `${YYYY}-${MM}-${DD} ${hh}:${mm}:${ss}`;
    }
    function showMessage(msg, color) {
      const messageDiv = document.getElementById("message");
      messageDiv.style.color = color;
      messageDiv.innerText = msg;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    // 折りたたみの開閉処理
    function toggleAccordion(elementId) {
      const target = document.getElementById(elementId);
      target.classList.toggle("hidden");
    }
  </script>
</body>
</html>
