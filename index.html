<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タスク管理</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .task-card { border: 1px solid #ccc; padding: 12px; margin-bottom: 8px; border-radius: 6px; }
    .completed { background-color: #f0f0f0; opacity: 0.8; }
    .btn { padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
    .btn-complete { background-color: #4caf50; color: white; border: none; }
    .btn-undo { background-color: #e0e0e0; color: #333; }
  </style>
</head>
<body>

  <h2>タスク一覧</h2>

  <!-- 担当者絞り込み -->
  <label for="userFilter">担当者: </label>
  <select id="userFilter" onchange="renderTasks()">
    <option value="all">全員を表示</option>
    <!-- JSでユーザーの選択肢を動的に追加します -->
  </select>

  <hr>

  <!-- タスクリスト表示エリア -->
  <div id="taskList"></div>

  <script>
    // サンプルデータ（GAS等から取得するデータのイメージです）
    // userId だけでなく userName を持たせる構造に変更しています
    let tasks = [
      { id: 1, title: "提案書の作成", userName: "山田 太郎", completed: false },
      { id: 2, title: "経費精算の申請", userName: "佐藤 花子", completed: true },
      { id: 3, title: "会議資料の印刷", userName: "山田 太郎", completed: false }
    ];

    // 担当者フィルターの選択肢を動的に生成する関数
    function initUserFilter() {
      const filterSelect = document.getElementById('userFilter');
      // 重複のないユーザー名一覧を取得
      const userNames = [...new Set(tasks.map(task => task.userName))];

      userNames.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        filterSelect.appendChild(option);
      });
    }

    // タスク一覧を描画する関数
    function renderTasks() {
      const taskList = document.getElementById('taskList');
      const selectedUser = document.getElementById('userFilter').value;
      taskList.innerHTML = '';

      // 選択された担当者でフィルタリング
      const filteredTasks = tasks.filter(task => {
        return selectedUser === 'all' || task.userName === selectedUser;
      });

      filteredTasks.forEach(task => {
        const card = document.createElement('div');
        card.className = `task-card ${task.completed ? 'completed' : ''}`;

        // ボタンの文言とスタイルを状態によって切り替え
        const buttonText = task.completed ? '未完了に戻す' : '✓ 完了';
        const buttonClass = task.completed ? 'btn-undo' : 'btn-complete';

        card.innerHTML = `
          <div>
            <strong>${escapeHtml(task.title)}</strong>
            <span style="color: #666; font-size: 0.9em; margin-left: 8px;">
              (担当: ${escapeHtml(task.userName)})
            </span>
          </div>
          <div style="margin-top: 8px;">
            <button class="btn ${buttonClass}" onclick="toggleTask(${task.id})">
              ${buttonText}
            </button>
          </div>
        `;
        taskList.appendChild(card);
      });
    }

    // 完了/未完了のトグル処理
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        renderTasks(); // 状態更新後に再描画
      }
    }

    // XSS対策用のエスケープ関数
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[match]);
    }

    // 初期化実行
    initUserFilter();
    renderTasks();
  </script>
</body>
</html>
