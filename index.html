<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>タスク管理アプリ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #6366f1;
      --bg-color: #fafafa;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      --radius: 10px;
      --shadow-subtle:
        0 1px 3px 0 rgba(0, 0, 0, 0.05),
        0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 48px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      background: var(--card-bg);
      padding: 36px;
      border-radius: 16px;
      box-shadow: var(--shadow-subtle);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 520px;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    h3 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      font-size: 0.9rem;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    button {
      padding: 10px 16px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f8fafc;
      border-color: var(--border-hover);
    }

    .btn-danger {
      background-color: transparent;
      color: #ef4444;
      border: 1px solid #fee2e2;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #fef2f2;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #4f46e5;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    #message-top {
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      padding: 8px 12px;
      margin-bottom: 16px;
      border-radius: var(--radius);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ai-assistant-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #f1f5f9;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .ai-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #cbd5e1;
      border: 2px solid #ffffff;
      flex-shrink: 0;
    }

    .ai-speech-bubble {
      position: relative;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-subtle);
      line-height: 1.5;
      flex: 1;
      min-height: 44px;
    }

    .ai-speech-bubble::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 14px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #ffffff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }

    #user-info {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .add-task-box {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .add-task-box input {
      flex: 1;
    }

    .tabs {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: calc(var(--radius) - 2px);
      margin-bottom: 16px;
      gap: 2px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .tab-btn:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .tab-btn.active {
      color: var(--text-main);
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    #task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: #ffffff;
      transition: var(--transition);
      gap: 12px;
    }

    .task-item:hover {
      border-color: var(--border-hover);
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .task-title {
      flex: 1;
      min-width: 0;
      word-break: break-word;
      line-height: 1.5;
    }

    .task-owner {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-right: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .section-box {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .accordion-toggle {
      width: 100%;
      text-align: left;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .filter-bar {
      margin-top: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-bar select {
      flex: 1;
    }

    .log-item {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .admin-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .login-note {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 0.72rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 560px) {
      body {
        padding: 16px 8px;
      }

      .container {
        padding: 22px 16px;
      }

      .header {
        align-items: flex-start;
      }

      .task-item {
        align-items: flex-start;
      }

      .task-item button {
        flex-shrink: 0;
      }

      .filter-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .filter-bar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="message-top"></div>

    <!-- ログイン -->
    <div id="login-section">

      <h2>ログイン</h2>

      <div class="form-group">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" value="管理人" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" value="admin123" autocomplete="current-password">
      </div>

      <button onclick="login()" id="login-button" style="width: 100%; margin-top: 8px;">
        ログイン
      </button>

      <div class="login-note">
        ログイン情報は安全に管理してください。
      </div>

    </div>

    <!-- アプリ -->
    <div id="app-section" class="hidden">

      <div class="header">
        <span id="user-info">ようこそ！</span>

        <button onclick="logout()" class="btn-danger">
          ログアウト
        </button>
      </div>

      <!-- AI -->
      <div class="ai-assistant-card">

        <img
          id="ai-avatar-img"
          class="ai-avatar"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23cbd5e1'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='32' fill='%230f172a'>AI</text></svg>"
          alt="AI Icon"
          onerror="this.src=createDefaultAvatar();"
        >

        <div id="ai-bubble-text" class="ai-speech-bubble">
          おかえりなさい！今日もタスク管理を頑張りましょう！
        </div>

      </div>

      <!-- 一括反映 -->
      <div
        id="batch-bar"
        style="
          margin-bottom: 16px;
          padding: 12px;
          background: #f8fafc;
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
        "
      >

        <span>
          未反映の変更:
          <strong id="pending-count">0</strong> 件
        </span>

        <button
          id="btn-submit"
          class="btn-primary"
          onclick="submitBatchChanges()"
          disabled
        >
          変更を反映する
        </button>

      </div>

      <!-- タスク追加 -->
      <h3>タスク追加</h3>

      <div class="add-task-box">

        <input
          type="text"
          id="new-task-title"
          placeholder="新しいタスクを入力..."
          onkeydown="if(event.key === 'Enter') createTask();"
        >

        <button onclick="createTask()">
          追加
        </button>

      </div>

      <!-- タスク一覧 -->
      <h3>タスク一覧</h3>

      <div class="tabs">

        <button
          id="tab-uncompleted"
          class="tab-btn active"
          onclick="switchStatusTab('未完了')"
        >
          未完了
        </button>

        <button
          id="tab-completed"
          class="tab-btn"
          onclick="switchStatusTab('完了')"
        >
          完了
        </button>

        <button
          id="tab-all"
          class="tab-btn"
          onclick="switchStatusTab('すべて')"
        >
          すべて
        </button>

      </div>

      <!-- 検索 -->
      <div style="margin-bottom: 12px; text-align: right;">

        <button
          onclick="toggleAccordion('search-box')"
          class="btn-secondary"
          style="font-size: 0.75rem; padding: 4px 8px;"
        >
          🔍 タスクを検索
        </button>

      </div>

      <div id="search-box" class="hidden" style="margin-bottom: 16px;">

        <input
          type="text"
          id="task-search-input"
          placeholder="タスク名で検索..."
          oninput="renderTasks()"
        >

      </div>

      <!-- 管理者ユーザーフィルター -->
      <div id="user-filter-box" class="filter-bar hidden">

        <label
          for="user-select"
          style="margin: 0; white-space: nowrap;"
        >
          表示ユーザー:
        </label>

        <select id="user-select" onchange="renderTasks()">
          <option value="ALL">すべてのユーザー</option>
        </select>

      </div>

      <div id="task-list">
        <div class="empty-state">読み込み中...</div>
      </div>

      <!-- アカウント設定 -->
      <div class="section-box">

        <button
          onclick="toggleAccordion('profile-setting-box')"
          class="btn-secondary accordion-toggle"
        >
          <span>⚙️ アカウント設定・AI調整</span>
          <span style="font-size: 0.75rem;">▽</span>
        </button>

        <div
          id="profile-setting-box"
          class="hidden"
          style="
            margin-top: 16px;
            padding: 16px;
            background: #f8fafc;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
          "
        >

          <div class="form-group">

            <label for="edit-username">
              新しいユーザー名
            </label>

            <input
              type="text"
              id="edit-username"
              autocomplete="username"
            >

          </div>

          <div class="form-group">

            <label for="edit-password">
              新しいパスワード
            </label>

            <input
              type="password"
              id="edit-password"
              placeholder="変更する場合のみ入力"
              autocomplete="new-password"
            >

            <div style="
              margin-top: 5px;
              color: var(--text-muted);
              font-size: 0.7rem;
            ">
              ※空欄の場合、現在のパスワードを維持します。
            </div>

          </div>

          <div class="form-group">

            <label for="edit-prompt">
              AIのカスタムプロンプト（指示文）
            </label>

            <textarea
              id="edit-prompt"
              rows="4"
              placeholder="例：あなたは優しく励ましてくれるアシスタントです。"
            ></textarea>

          </div>

          <div class="form-group">

            <label for="edit-avatar-url">
              アイコン画像URL
            </label>

            <input
              type="url"
              id="edit-avatar-url"
              placeholder="https://example.com/image.png"
            >

          </div>

          <button
            onclick="updateProfile()"
            class="btn-secondary"
            style="width: 100%;"
          >
            設定を保存する
          </button>

        </div>

      </div>

      <!-- 管理者 -->
      <div id="admin-section" class="section-box admin-box hidden">

        <button
          onclick="toggleAccordion('admin-log-box')"
          class="btn-secondary accordion-toggle"
        >
          <span>
            📜 【マスタ機能】全体操作履歴
          </span>

          <span style="font-size: 0.75rem;">
            ▽
          </span>
        </button>

        <div
          id="admin-log-box"
          class="hidden"
          style="margin-top: 16px;"
        >

          <button
            onclick="loadLogs()"
            class="btn-secondary"
            style="margin-bottom: 12px; width: 100%;"
          >
            履歴ログを最新に更新
          </button>

          <div id="log-list">
            ボタンを押すと履歴を取得します
          </div>

        </div>

      </div>

    </div>

  </div>

  <script>

    /*
     * ============================================================
     * GAS WebアプリURL
     * ============================================================
     */
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbwrujO1lvSsyCSYRpcbLxoLHhkziiVouQo4LQvK23QejUfYGCLEUuJNfxUJurGSTQuy/exec";


    /*
     * ============================================================
     * グローバル状態
     * ============================================================
     */

    let currentUser = null;

    let authToken = null;

    let allTasksCache = [];

    let currentStatusTab = "未完了";

    let pendingChanges = [];


    /*
     * ============================================================
     * 起動
     * ============================================================
     */

    window.onload = async () => {

      const savedUser =
        sessionStorage.getItem("user");

      const savedToken =
        sessionStorage.getItem("token");

      if (savedUser && savedToken) {

        try {

          currentUser =
            JSON.parse(savedUser);

          authToken =
            savedToken;

          const result =
            await apiRequest({
              action: "verifySession"
            });

          if (result.status === "success") {

            currentUser =
              result.user;

            sessionStorage.setItem(
              "user",
              JSON.stringify(currentUser)
            );

            showApp();

          } else {

            clearSession();

          }

        } catch (err) {

          console.error(err);

          clearSession();

        }

      }

    };


    /*
     * ============================================================
     * API共通処理
     * ============================================================
     */

    async function apiRequest(payload) {

      const body = {
        ...payload
      };

      if (authToken) {
        body.token = authToken;
      }

      const response =
        await fetch(GAS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(body)
        });

      if (!response.ok) {
        throw new Error(
          "HTTPエラー: " + response.status
        );
      }

      const data =
        await response.json();

      return data;
    }


    /*
     * ============================================================
     * ログイン
     * ============================================================
     */

    async function login() {

      const usernameInput =
        document.getElementById("username").value.trim();

      const passwordInput =
        document.getElementById("password").value;

      if (!usernameInput || !passwordInput) {

        showMessage(
          "ユーザー名とパスワードを入力してください",
          "#e11d48"
        );

        return;
      }

      const loginButton =
        document.getElementById("login-button");

      loginButton.disabled = true;

      showMessage(
        "通信中...",
        "#475569"
      );

      try {

        const data =
          await apiRequest({
            action: "login",
            username: usernameInput,
            password: passwordInput
          });

        if (data.status === "success") {

          currentUser =
            data.user;

          authToken =
            data.token;

          sessionStorage.setItem(
            "user",
            JSON.stringify(currentUser)
          );

          sessionStorage.setItem(
            "token",
            authToken
          );

          if (data.welcomeMessage) {

            sessionStorage.setItem(
              "welcomeMessage",
              data.welcomeMessage
            );

          } else {

            sessionStorage.removeItem(
              "welcomeMessage"
            );

          }

          showMessage(
            "",
            ""
          );

          showApp();

        } else {

          showMessage(
            data.message || "ログインに失敗しました",
            "#e11d48"
          );

        }

      } catch (err) {

        console.error(err);

        showMessage(
          "通信エラーが発生しました: " + err.message,
          "#e11d48"
        );

      } finally {

        loginButton.disabled = false;

      }

    }


    /*
     * ============================================================
     * ログアウト
     * ============================================================
     */

    function logout() {

      clearSession();

      document
        .getElementById("app-section")
        .classList.add("hidden");

      document
        .getElementById("admin-section")
        .classList.add("hidden");

      document
        .getElementById("user-filter-box")
        .classList.add("hidden");

      document
        .getElementById("login-section")
        .classList.remove("hidden");

      document
        .getElementById("password")
        .value = "";

      showMessage(
        "ログアウトしました",
        "#059669"
      );

    }


    function clearSession() {

      sessionStorage.removeItem("user");
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("welcomeMessage");

      currentUser = null;
      authToken = null;

      allTasksCache = [];
      pendingChanges = [];

      updatePendingUI();

    }


    /*
     * ============================================================
     * アプリ表示
     * ============================================================
     */

    function showApp() {

      document
        .getElementById("login-section")
        .classList.add("hidden");

      document
        .getElementById("app-section")
        .classList.remove("hidden");

      document
        .getElementById("user-info")
        .innerText =
        `${currentUser.username} さん`;

      if (currentUser.role === "admin") {

        document
          .getElementById("user-info")
          .innerHTML =
          `${escapeHtml(currentUser.username)} さん` +
          `<span class="admin-badge">ADMIN</span>`;

      }


      /*
       * プロフィール初期値
       */

      document
        .getElementById("edit-username")
        .value =
        currentUser.username || "";

      document
        .getElementById("edit-password")
        .value = "";

      document
        .getElementById("edit-prompt")
        .value =
        currentUser.prompt || "";

      document
        .getElementById("edit-avatar-url")
        .value =
        currentUser.avatarUrl || "";


      /*
       * アイコン
       */

      const avatar =
        document.getElementById("ai-avatar-img");

      if (currentUser.avatarUrl) {

        avatar.src =
          currentUser.avatarUrl;

      } else {

        avatar.src =
          createDefaultAvatar();

      }


      /*
       * AI挨拶
       */

      const savedWelcomeMessage =
        sessionStorage.getItem(
          "welcomeMessage"
        );

      if (savedWelcomeMessage) {

        document
          .getElementById("ai-bubble-text")
          .innerText =
          savedWelcomeMessage;

      } else {

        document
          .getElementById("ai-bubble-text")
          .innerText =
          `${currentUser.username} さん、おかえりなさい！今日もよろしくお願いいたします！`;

      }


      /*
       * 管理者表示
       */

      const adminSection =
        document.getElementById(
          "admin-section"
        );

      const userFilterBox =
        document.getElementById(
          "user-filter-box"
        );

      if (currentUser.role === "admin") {

        adminSection
          .classList.remove("hidden");

        userFilterBox
          .classList.remove("hidden");

      } else {

        adminSection
          .classList.add("hidden");

        userFilterBox
          .classList.add("hidden");

      }

      loadTasks();

    }


    /*
     * ============================================================
     * タスク取得
     * ============================================================
     */

    async function loadTasks() {

      const taskListDiv =
        document.getElementById("task-list");

      taskListDiv.innerHTML =
        '<div class="empty-state">読み込み中...</div>';

      try {

        const data =
          await apiRequest({
            action: "getTasks"
          });

        if (data.status !== "success") {

          if (data.authExpired) {
            handleAuthExpired();
            return;
          }

          taskListDiv.innerHTML =
            `<div class="empty-state" style="color:#e11d48;">
              ${escapeHtml(data.message || "取得に失敗しました")}
            </div>`;

          return;
        }

        allTasksCache =
          Array.isArray(data.tasks)
            ? data.tasks
            : [];

        if (currentUser.role === "admin") {

          setupUserFilterOptions();

        } else {

          document
            .getElementById("user-select")
            .innerHTML =
            '<option value="ALL">すべてのユーザー</option>';

        }

        renderTasks();

      } catch (err) {

        console.error(err);

        taskListDiv.innerHTML =
          '<div class="empty-state" style="color:#e11d48;">タスクの取得に失敗しました</div>';

      }

    }


    /*
     * ============================================================
     * ユーザーフィルター
     * ============================================================
     */

    function setupUserFilterOptions() {

      const select =
        document.getElementById(
          "user-select"
        );

      const currentSelected =
        select.value || "ALL";

      select.innerHTML =
        '<option value="ALL">すべてのユーザー</option>';

      const userMap =
        new Map();

      allTasksCache.forEach(task => {

        if (
          task.userId &&
          !userMap.has(task.userId)
        ) {

          userMap.set(
            task.userId,
            task.username || task.userId
          );

        }

      });

      userMap.forEach(
        (name, uid) => {

          const option =
            document.createElement(
              "option"
            );

          option.value = uid;
          option.innerText = name;

          select.appendChild(option);

        }
      );

      if (
        Array.from(select.options)
          .some(option =>
            option.value === currentSelected
          )
      ) {

        select.value =
          currentSelected;

      } else {

        select.value = "ALL";

      }

    }


    /*
     * ============================================================
     * タブ
     * ============================================================
     */

    function switchStatusTab(status) {

      currentStatusTab =
        status;

      document
        .querySelectorAll(".tab-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      if (status === "未完了") {

        document
          .getElementById("tab-uncompleted")
          .classList.add("active");

      }

      if (status === "完了") {

        document
          .getElementById("tab-completed")
          .classList.add("active");

      }

      if (status === "すべて") {

        document
          .getElementById("tab-all")
          .classList.add("active");

      }

      renderTasks();

    }


    /*
     * ============================================================
     * タスク描画
     * ============================================================
     */

    function renderTasks() {

      const taskListDiv =
        document.getElementById(
          "task-list"
        );

      const searchQuery =
        document
          .getElementById(
            "task-search-input"
          )
          ?.value
          .trim()
          .toLowerCase() || "";

      let filtered =
        [...allTasksCache];


      /*
       * ステータス
       */

      if (currentStatusTab !== "すべて") {

        filtered =
          filtered.filter(
            task =>
              task.status === currentStatusTab
          );

      }


      /*
       * 管理者ユーザーフィルター
       */

      if (currentUser.role === "admin") {

        const selectedUser =
          document
            .getElementById(
              "user-select"
            )
            .value;

        if (selectedUser !== "ALL") {

          filtered =
            filtered.filter(
              task =>
                String(task.userId) ===
                String(selectedUser)
            );

        }

      }


      /*
       * 検索
       */

      if (searchQuery) {

        filtered =
          filtered.filter(task =>
            String(task.title || "")
              .toLowerCase()
              .includes(searchQuery)
          );

      }


      /*
       * 空
       */

      if (filtered.length === 0) {

        taskListDiv.innerHTML =
          '<div class="empty-state">該当するタスクはありません</div>';

        return;

      }


      /*
       * 描画
       */

      taskListDiv.innerHTML = "";

      filtered.forEach(task => {

        const item =
          document.createElement("div");

        item.className =
          `task-item ${
            task.status === "完了"
              ? "completed"
              : ""
          }`;


        const isCompleted =
          task.status === "完了";


        const ownerHtml =
          currentUser.role === "admin"
            ? `<small class="task-owner">
                (${escapeHtml(task.username || task.userId)})
              </small>`
            : "";


        const titleSpan =
          document.createElement("span");

        titleSpan.className =
          "task-title";

        titleSpan.innerHTML =
          `${ownerHtml}${escapeHtml(task.title)}`;


        const button =
          document.createElement("button");

        if (isCompleted) {

          button.className =
            "btn-secondary";

          button.innerText =
            "未完了に戻す";

        } else {

          button.innerText =
            "完了にする";

        }

        button.onclick = () => {

          toggleTaskStatusLocal(
            task.id,
            task.status
          );

        };


        item.appendChild(titleSpan);
        item.appendChild(button);

        taskListDiv.appendChild(item);

      });

    }


    /*
     * ============================================================
     * タスク状態変更
     * ============================================================
     */

    function toggleTaskStatusLocal(
      taskId,
      currentStatus
    ) {

      const newStatus =
        currentStatus === "完了"
          ? "未完了"
          : "完了";

      const task =
        allTasksCache.find(
          item =>
            String(item.id) ===
            String(taskId)
        );

      if (!task) {
        return;
      }


      task.status =
        newStatus;


      const existingIndex =
        pendingChanges.findIndex(
          change =>
            String(change.taskId) ===
            String(taskId)
        );


      if (existingIndex >= 0) {

        pendingChanges[
          existingIndex
        ].newStatus =
          newStatus;

      } else {

        pendingChanges.push({
          taskId: taskId,
          taskTitle: task.title,
          newStatus: newStatus
        });

      }


      updatePendingUI();

      renderTasks();

    }


    /*
     * ============================================================
     * 未反映件数
     * ============================================================
     */

    function updatePendingUI() {

      const countEl =
        document.getElementById(
          "pending-count"
        );

      const buttonEl =
        document.getElementById(
          "btn-submit"
        );

      if (countEl) {

        countEl.innerText =
          pendingChanges.length;

      }

      if (buttonEl) {

        buttonEl.disabled =
          pendingChanges.length === 0;

      }

    }


    /*
     * ============================================================
     * 一括反映
     * ============================================================
     */

    async function submitBatchChanges() {

      if (pendingChanges.length === 0) {
        return;
      }

      const changes =
        pendingChanges.map(change => ({
          taskId: change.taskId,
          taskTitle: change.taskTitle,
          newStatus: change.newStatus
        }));


      showMessage(
        "変更を反映中...",
        "#475569"
      );


      const button =
        document.getElementById(
          "btn-submit"
        );

      button.disabled = true;


      try {

        const data =
          await apiRequest({
            action: "applyBatchChanges",
            changes: changes
          });


        if (data.status === "success") {

          pendingChanges = [];

          updatePendingUI();

          showMessage(
            data.emailSent
              ? "反映とメール送信が完了しました！"
              : "変更を反映しました！",
            "#16a34a"
          );


          if (data.aiFeedback) {

            document
              .getElementById(
                "ai-bubble-text"
              )
              .innerText =
              data.aiFeedback;

          }


          await loadTasks();


          if (currentUser.role === "admin") {
            await loadLogs();
          }

        } else {

          showMessage(
            "エラー: " +
            (data.message || "変更に失敗しました"),
            "#e11d48"
          );

          renderTasks();

        }

      } catch (err) {

        console.error(err);

        showMessage(
          "反映に失敗しました: " +
          err.message,
          "#e11d48"
        );

        renderTasks();

      } finally {

        updatePendingUI();

      }

    }


    /*
     * ============================================================
     * タスク作成
     * ============================================================
     */

    async function createTask() {

      const input =
        document.getElementById(
          "new-task-title"
        );

      const title =
        input.value.trim();

      if (!title) {

        showMessage(
          "タスク名を入力してください",
          "#e11d48"
        );

        input.focus();

        return;

      }


      showMessage(
        "タスクを追加中...",
        "#475569"
      );


      try {

        const data =
          await apiRequest({
            action: "createTask",
            title: title
          });


        if (data.status === "success") {

          input.value = "";

          showMessage(
            "タスクを追加しました！",
            "#059669"
          );

          await loadTasks();

          if (currentUser.role === "admin") {
            await loadLogs();
          }

        } else {

          showMessage(
            data.message ||
            "追加に失敗しました",
            "#e11d48"
          );

        }

      } catch (err) {

        console.error(err);

        showMessage(
          "追加に失敗しました: " +
          err.message,
          "#e11d48"
        );

      }

    }


    /*
     * ============================================================
     * プロフィール更新
     * ============================================================
     */

    async function updateProfile() {

      const newUsername =
        document
          .getElementById(
            "edit-username"
          )
          .value
          .trim();

      const newPassword =
        document
          .getElementById(
            "edit-password"
          )
          .value
          .trim();

      const newPrompt =
        document
          .getElementById(
            "edit-prompt"
          )
          .value
          .trim();

      const newAvatarUrl =
        document
          .getElementById(
            "edit-avatar-url"
          )
          .value
          .trim();


      if (!newUsername) {

        showMessage(
          "ユーザー名を入力してください",
          "#e11d48"
        );

        return;

      }


      showMessage(
        "更新中...",
        "#475569"
      );


      try {

        const payload = {
          action: "updateUserProfile",
          newUsername: newUsername,
          newPrompt: newPrompt,
          newAvatarUrl: newAvatarUrl
        };


        if (newPassword) {

          payload.newPassword =
            newPassword;

        }


        const data =
          await apiRequest(payload);


        if (data.status === "success") {

          currentUser.username =
            data.updatedUsername;

          currentUser.prompt =
            data.updatedPrompt;

          currentUser.avatarUrl =
            data.updatedAvatarUrl;


          sessionStorage.setItem(
            "user",
            JSON.stringify(currentUser)
          );


          if (currentUser.role === "admin") {

            document
              .getElementById("user-info")
              .innerHTML =
              `${escapeHtml(currentUser.username)} さん` +
              `<span class="admin-badge">ADMIN</span>`;

          } else {

            document
              .getElementById("user-info")
              .innerText =
              `${currentUser.username} さん`;

          }


          document
            .getElementById(
              "edit-password"
            )
            .value = "";


          const avatar =
            document.getElementById(
              "ai-avatar-img"
            );


          if (currentUser.avatarUrl) {

            avatar.src =
              currentUser.avatarUrl;

          } else {

            avatar.src =
              createDefaultAvatar();

          }


          showMessage(
            "アカウント情報を更新しました！",
            "#059669"
          );


          if (currentUser.role === "admin") {
            await loadLogs();
          }

        } else {

          showMessage(
            data.message ||
            "更新に失敗しました",
            "#e11d48"
          );

        }

      } catch (err) {

        console.error(err);

        showMessage(
          "更新に失敗しました: " +
          err.message,
          "#e11d48"
        );

      }

    }


    /*
     * ============================================================
     * ログ
     * ============================================================
     */

    async function loadLogs() {

      if (
        !currentUser ||
        currentUser.role !== "admin"
      ) {
        return;
      }


      const logListDiv =
        document.getElementById(
          "log-list"
        );


      logListDiv.innerHTML =
        '<div class="empty-state">履歴を取得中...</div>';


      try {

        const data =
          await apiRequest({
            action: "getLogs"
          });


        if (data.status !== "success") {

          logListDiv.innerHTML =
            `<div class="empty-state" style="color:#e11d48;">
              ${escapeHtml(data.message || "取得に失敗しました")}
            </div>`;

          return;

        }


        if (!data.logs || data.logs.length === 0) {

          logListDiv.innerHTML =
            '<div class="empty-state">履歴はありません</div>';

          return;

        }


        logListDiv.innerHTML = "";


        data.logs.forEach(log => {

          const item =
            document.createElement("div");

          item.className =
            "log-item";


          const formattedTime =
            formatTimestamp(
              log.timestamp
            );


          const displayUser =
            log.username ||
            log.userId;


          item.innerHTML =
            `<strong>[${escapeHtml(formattedTime)}]</strong>
             <span style="color:var(--text-muted);">
               (ユーザー: ${escapeHtml(displayUser)})
             </span>
             ${escapeHtml(log.action)}`;


          logListDiv.appendChild(item);

        });


      } catch (err) {

        console.error(err);

        logListDiv.innerHTML =
          '<div class="empty-state" style="color:#e11d48;">履歴の取得に失敗しました</div>';

      }

    }


    /*
     * ============================================================
     * 日付
     * ============================================================
     */

    function formatTimestamp(ts) {

      if (!ts) {
        return "";
      }

      const d =
        new Date(ts);

      if (isNaN(d.getTime())) {
        return String(ts);
      }

      const pad =
        n =>
          String(n).padStart(2, "0");


      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    }


    /*
     * ============================================================
     * メッセージ
     * ============================================================
     */

    function showMessage(
      msg,
      color
    ) {

      const messageDiv =
        document.getElementById(
          "message-top"
        );

      messageDiv.style.color =
        color || "";

      messageDiv.innerText =
        msg || "";

    }


    /*
     * ============================================================
     * HTMLエスケープ
     * ============================================================
     */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * ============================================================
     * アコーディオン
     * ============================================================
     */

    function toggleAccordion(
      elementId
    ) {

      const target =
        document.getElementById(
          elementId
        );

      if (target) {
        target.classList.toggle(
          "hidden"
        );
      }

    }


    /*
     * ============================================================
     * 認証切れ
     * ============================================================
     */

    function handleAuthExpired() {

      clearSession();

      document
        .getElementById("app-section")
        .classList.add("hidden");

      document
        .getElementById("login-section")
        .classList.remove("hidden");

      showMessage(
        "ログインの有効期限が切れました。もう一度ログインしてください。",
        "#e11d48"
      );

    }


    /*
     * ============================================================
     * デフォルトAIアイコン
     * ============================================================
     */

    function createDefaultAvatar() {

      return "data:image/svg+xml;utf8," +
        "<svg xmlns='http://www.w3.org/2000/svg' " +
        "width='100' height='100' viewBox='0 0 100 100'>" +
        "<circle cx='50' cy='50' r='50' fill='%23cbd5e1'/>" +
        "<text x='50%' y='55%' " +
        "dominant-baseline='middle' " +
        "text-anchor='middle' " +
        "font-family='sans-serif' " +
        "font-size='32' " +
        "fill='%230f172a'>AI</text>" +
        "</svg>";

    }

  </script>

</body>
